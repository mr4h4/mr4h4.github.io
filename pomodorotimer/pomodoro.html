<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mr4h4 | Pomodoro Timer</title>
    <link rel="icon" href="../mr4h4.ico"/>
    <link rel="stylesheet" href="/pomodorotimer/pomodoro.css">
</head>
<body>
    <h2 id="pomodoro">Pomodoro #0</h2>
    <h1 id="timer">00:00</h1>
    
    <button id="button" class="start">START</button>

    <div class="config-panel">
        <h3>Pomodoro Settings (minutes)</h3>

        <div class="config-item">
            <label for="work-time">Work Time</label>
            <input id="work-time" type="number" min="1" max="999" value="25">
        </div>

        <div class="config-item">
            <label for="short-rest">Short Break</label>
            <input id="short-rest" type="number" min="1" max="999" value="5">
        </div>

        <div class="config-item">
            <label for="long-rest">Long Break</label>
            <input id="long-rest" type="number" min="1" max="999" value="15">
        </div>
    </div>

    <audio id="alarm-sound" src="/pomodorotimer/alarm.mp3" preload="auto"></audio>

</body>
<script src="/pomodorotimer/pomodoro.js"></script>
</html>
