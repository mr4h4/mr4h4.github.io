<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="guess.css">
    <link rel="icon" href="../mr4h4.ico">
    <title>mr4h4 | GuessTheNumber</title>
</head>
<body>
    <div id="record-container">
        <p>Record: None</p>
        <p>Wins: 0</p>
    </div>

    <div id="label">
        <h1>GuessTheNumber</h1>
        <p>You must guess a number between 1 and 10.000, you have 10 attempts. Do you dare?</p>
    </div>
    

    <div id="user-input">
        <input id="user-number" type="number" placeholder="Guess the number:" min="1" max="10000" style="width: 150px;">
        <button id="submit-button">Submit</button>
    </div>
    
    <div id="messages">
        <p id="hints">Type your first attempt</p>
        <p id="attempts"> <espan id="attempt-display" style="color: #ffcc66;">10</espan> attempts remaining</p>
    </div>
    
</body>
</html>
<script src="guess.js"></script>
