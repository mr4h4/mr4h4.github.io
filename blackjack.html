<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mr4h4 | ♠ Blackjack</title>
    <link rel="icon" href="/favicon.ico"/>
    <link rel="stylesheet" href="blackjack.css"/>
</head>

<body>
    <h1 style="text-align: center;">♠ Blackjack: Can You Beat the House?</h1>
    <hr>
    <!-- Dealer Hand -->
    <div id="dealerHandContainer">
        <p style="font-weight: bold; text-align: center;">Dealer: <span id="dealerScore"></span></p>
    </div>

    <!-- User Hand -->
    <div id="userHandContainer">
        <p style="font-weight: bold; text-align: center;">User: <span id="userScore"></span></p>

        <!-- Balance -->
        <div id="balanceArea">
            <p style="text-align: center;">Balance: <span id="balance">5000$</span></p>
        </div>
    </div>

    <!-- Betting -->
    <div id="buttons">
        <label for="betRange">Bet: <span id="betDisplay">1</span>$</label>
        <input type="range" id="bet" min="1" max="1000" value="1" step="0.5"> <br>

        <button id="deal">DEAL</button> 
        <button id="hit">HIT</button> 
        <button id="stand">STAND</button>
    </div>

    <div id="roundCounterContainer" style="text-align: center; margin-top: 20px; font-size: 20px; font-weight: bold; color: white;">
    Round: <span id="roundCounter">0</span>
    </div>

    <!-- Result Message -->
    <div id="resultMessage" style="margin-top: 15px; font-size: 1.2em; font-weight: bold;"></div>

    <!-- Scripts -->
    <script src="blackjack.js"></script>
</body>
</html>
