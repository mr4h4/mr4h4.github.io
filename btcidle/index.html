<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css"/>
    <link rel="icon" type="image/webp" href="./img/bitcoin.webp">
    <title>BTC Idle | mr4h4</title>
</head>
<body>
    <header>
        <div id="scoreboard">
            <div id="scores" style="margin-top: 10px;">
                <p id="prestige-score"><span>Prestige: </span> <span id="value">0</span></p>
                <h1 id="dollar-score"><span>$</span><span class="value">0.00</span></h1>
                <p id="bitcoin-score"><span class="value">0.0000000</span> <span>BTC</span></p>
                <p id="click-score"><span>Clicks: </span> <span id="value">0</span></p>
            </div>

            <div id="menu-container">
                <label id="menu-label" for="t">☰</label>
                <input id="t" type="checkbox" hidden>

                <div id="menu">
                    <button class="def-button" id="toggle-upgrades">Upgrades</button>
                    <div id="upgrades" style="display:none;">
                        <button class="def-button" id="click-upgrade">Click-Power<p id="click-level">1</p ><p><span>$</span><span id="click-price">100.00</span></p></button>
                        <button class="def-button" id="auto-upgrade">Auto-Click<br><p id ="auto-level">0</p> <p><span>$</span><span id="auto-price">1000.00</span></p></button>
                    </div>

                    <button class="def-button" id="toggle-achievements">Achievements</button>
                    <div id="achievements" style="display:none;">
                          <!-- Crypto Bro -->
                        <div id="cryptoBro" class="achievement not-achieved">
                            <img src="./img/achievements/cryptobrospath.png">
                            <div class="achievement-text">
                            <h4>Crypto Bro</h4>
                            <p>Invest your first dollars.</p>
                            </div>
                        </div>

                        <!-- Stonks -->
                        <div id="stonks" class="achievement not-achieved">
                            <img src="./img/achievements/stonks.png">
                            <div class="achievement-text">
                            <h4>Stonks</h4>
                            <p>Get your first Auto-Click upgrade.</p>
                            </div>
                        </div>

                        <!-- Golden Reflexes -->
                        <div id="goldenreflexes" class="achievement not-achieved">
                            <img src="./img/achievements/goldenreflexes.png">
                            <div class="achievement-text">
                            <h4>Golden Reflexes</h4>
                            <p>Catch a falling coin.</p>
                            </div>
                        </div>

                        <!-- Hash Slayer -->
                        <div id="hashslayer" class="achievement not-achieved">
                            <img src="./img/achievements/hashslayer.png">
                            <div class="achievement-text">
                            <h4>Hash Slayer</h4>
                            <p>Earn your first Bitcoin.</p>
                            </div>
                        </div>

                        <!-- Millionaire -->
                        <div id="millionaire" class="achievement not-achieved">
                            <img src="./img/achievements/millionaire.png">
                            <div class="achievement-text">
                            <h4>Millionaire</h4>
                            <p>Earn your first million.</p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </header>
    <main>
        <canvas id="matrix"></canvas>
    </main>
    <footer>
        <div id="bitcoin-container">
            <h3>BTC Price: $<span id="bitcoin-price">.........</span></h3>
        </div>
    </footer>
</body>
    <script src="achievements.js"></script>
    <script src="local-storage.js"></script>
    <script src="btc.js"></script>
    <script src="matrix.js"></script>
    <script src="menu.js"></script>
    <script src="click.js"></script>
    <script src="upgrades.js"></script>
    <script src="events.js"></script>

</html>
